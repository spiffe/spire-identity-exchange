name: spire-identity-exchange
logLevel: ${SIX_LOG_LEVEL}
purposeMode: ${SIX_PURPOSE_MODE}
server:
  grpcPort: ${SIX_GRPC_PORT}
  restPort: ${SIX_REST_PORT}
  metricsPort: ${SIX_METRICS_PORT}
  tls:
    certFile: /etc/spire/identity-exchange/${SYSTEMD_INSTANCE}/certs/server.pem
    keyFile: /etc/spire/identity-exchange/${SYSTEMD_INSTANCE}/certs/server.key
spire:
  agentWorkloadSocketPath: /var/run/spire/agent/sockets/${SYSTEMD_INSTANCE}/public/api.sock
  agentDelegatedSocketPath: /var/run/spire/agent/sockets/${SYSTEMD_INSTANCE}-six/private/admin.sock
  trustDomain: ${SPIFFE_TRUST_DOMAIN}
  svidTTL: ${SIX_SVID_TTL}
  auth:
    plugins:
    - plugin: github
      enabled: false
      config:
        allowedRepositories:
        - spiffe/spire-identity-exchange
        audiences:
        - spire-identity-exchange
    - plugin: gitlab
      enabled: false
      config:
        issuerURL: "https://gitlab.example.org"
        audiences:
        - spire-identity-exchange
        allowedNamespacePaths:
        - my-group
        allowedProjectPaths:
        - my-group/my-project
    - plugin: k8s_psat
      enabled: false
      config:
        clusterName: example
        audiences:
        - spire-identity-exchange
        allowedNamespaces:
        - default
        allowedServiceAccounts:
        - default/default
        kubeconfig: /etc/spire/identity-exchange/${SYSTEMD_INSTANCE}/kubeconfig
        jwksCheck: true
        tokenReview: true
    - plugin: spiffe
      enabled: false
      config:
        issuerURL: "https://oidc-discovery-provider.other.org"
        #discoveryURL: "https://some-other-server.other.org"
        audiences:
        - spire-identity-exchange
        trustDomain: other.org
        pathPatterns:
        - "^/some-path/.*$"

