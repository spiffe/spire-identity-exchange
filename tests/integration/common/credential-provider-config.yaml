apiVersion: kubelet.config.k8s.io/v1
kind: CredentialProviderConfig
providers:
  - name: k8s-image-cred-spire-identity-exchange
    matchImages:
      - "zot.example.org:5000/*"
    defaultCacheDuration: "0s"
    apiVersion: credentialprovider.kubelet.k8s.io/v1
    args:
      - "--username=zot"
      - "--mode=spire-identity-exchange"
      - "--url=https://spire-identity-exchange-rest.example.org"
      - "--stack=k8s_psat"
      - "--registry-audience=zot"
      - "--disable-spiffe-workload-api"
      - "--timeout=10s"
    tokenAttributes:
      serviceAccountTokenAudience: "spire-identity-exchange"
      cacheType: "Token"
      requireServiceAccount: true
