apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-identity-exchange
  labels:
    app: spire-identity-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spire-identity-exchange
  template:
    metadata:
      labels:
        app: spire-identity-exchange
    spec:
      serviceAccountName: spire-identity-exchange
      containers:
        - name: spire-identity-exchange
          image: "ghcr.io/spiffe/spire-identity-exchange-server:dev"
          imagePullPolicy: Never
          args:
          - -config
          - /etc/spire/identity-exchange/default.json
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spire-identity-exchange-config
              mountPath: /etc/spire/identity-exchange/default.json
              subPath: default.json
              readOnly: true
            - name: spire-identity-exchange-secret
              mountPath: /secret
              readOnly: true
            - name: spire-agent-socket
              mountPath: /agent
              readOnly: true
      initContainers:
        #FIXME agent socket needs to exist before the exchange will start...
        - name: spire-agent
          image: "ghcr.io/spiffe/spire-agent:1.15.1"
          imagePullPolicy: Always
          restartPolicy: Always
          args:
            - -config
            - /etc/spire/agent/six-agent.conf
          ports:
            - containerPort: 8182
              name: healthz
          livenessProbe:
            httpGet:
              path: /live
              port: healthz
          readinessProbe:
            httpGet:
              path: /ready
              port: healthz
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
            - name: spire-identity-exchange-config
              mountPath: /etc/spire/agent/six-agent.conf
              subPath: six-agent.conf
              readOnly: true
            - name: spire-agent-socket
              mountPath: /agent
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: "csi.spiffe.io"
            readOnly: true
        - name: spire-agent-socket
          emptyDir: {}
        - name: spire-identity-exchange-config
          configMap:
            name: spire-identity-exchange
        - name: spire-identity-exchange-secret
          secret:
            secretName: spire-identity-exchange
