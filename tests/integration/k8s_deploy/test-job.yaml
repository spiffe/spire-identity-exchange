apiVersion: batch/v1
kind: Job
metadata:
  name: test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      hostAliases:
      volumes:
      - name: token-volume
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: spire-identity-exchange
              expirationSeconds: 3600
      containers:
      - name: main
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          TOKEN=$(cat /var/run/secrets/tokens/token)
          curl -f -H "Authorization: Bearer ${TOKEN}" \
            -X POST https://spire-identity-exchange-rest/api/v1/svid/k8s_psat/x509?format=spiffe-fd-tar \
            -k -sS -q | base64
        volumeMounts:
        - name: token-volume
          mountPath: /var/run/secrets/tokens
