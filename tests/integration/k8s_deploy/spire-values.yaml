spire-server:
  controllerManager:
    identities:
      clusterStaticEntries:
        test:
          parentID: spiffe://example.org/spire-identity-exchange
          spiffeID: spiffe://example.org/k8s-psat/test
          selectors:
            - k8s_psat:namespace:default
            - k8s_psat:service_account_name:default
  spireIdentityExchange:
    enabled: true

spire-identity-exchange:
  enabled: true
  tls:
    externalSecret:
      enabled: true
      secretName: spire-identity-exchange
  auth:
    passthroughPlugins: true
    plugins:
      k8s_psat:
        config:
          audiences:
            - spire-identity-exchange
          allowedServiceAccounts:
            - default/default
      spiffe:
        enabled: false
    stacks:
      image_pull:
        enabled: false
