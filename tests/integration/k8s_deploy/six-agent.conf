agent {
    log_level = "DEBUG"
    trust_domain = "example.org"
    server_address = "spire-server.spire-server"
    server_port = "443"

    trust_bundle_url = "http://localhost/trustbundle"
    trust_bundle_unix_socket = "/trustbundle/socket"
    rebootstrap_mode = "always"
    rebootstrap_delay = "5m"

    admin_socket_path = "/agent/admin.sock"
    authorized_delegates = ["spiffe://example.org/service/spire-identity-exchange"]
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port =  8182
    live_path = "/live"
    ready_path = "/ready"
}

plugins {
   KeyManager "memory" {
        plugin_data {}
    }

    NodeAttestor "x509pop" {
        plugin_data {
            spiffe_endpoint_socket = "unix:///spiffe-workload-api/spire-agent.sock"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {}
    }
}
