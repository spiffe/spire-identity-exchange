apiVersion: batch/v1
kind: Job
metadata:
  name: test2
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: zot.example.org:5000/test/busybox:latest
        command: ["/bin/sh", "-c"]
        args:
        - echo Hello there
      volumes:
      - name: spire-token-gate
        projected:
          sources:
          - serviceAccountToken:
              audience: spire-identity-exchange
              expirationSeconds: 3600
              path: token
