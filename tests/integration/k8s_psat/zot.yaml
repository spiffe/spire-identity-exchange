storage:
  rootDirectory: /var/lib/registry
http:
  address: 0.0.0.0
  port: "5000"
  readTimeout: 60s
  writeTimeout: 60s
  realm: zot-basic
  auth:
    bearer:
      realm: http://zot.example.org:5000/v2/auth
      service: zot-service
      oidc:
        # Dont do this in production. This is just for testing for now. Better to come later.
        - issuer: https://k8ssodp.example.org:8181
          skipIssuerCheck: true
          audiences:
            - zot
            - https://zot.example.org
          certificateAuthorityFile: /tmp/ca.pem
          claimMapping:
            username: claims.sub
  accessControl:
    adminPolicy:
      users:
        - root
      actions:
        - '*'
    repositories:
      '**':
        policies:
          - users:
              - spiffe://example.org/k8s-psat/test
            actions:
              - read
              - create
              - update
              - delete
          - users:
              - root
            actions:
              - create
              - read
              - update
              - delete
log:
  level: debug
