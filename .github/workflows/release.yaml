name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Set up Go
        uses: actions/setup-go@v5
      - name: Setup KO
        uses: ko-build/setup-ko@v0.8
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: release
        name: Do the release
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}
        run: |
          ko build ./cmd/spire-credentialcomposer-identity-exchange/ --platform=linux/amd64 --tags ${{ github.ref_name }} --base-import-paths
          ko build ./cmd/spire-server-attestor-spiffe-workload-api/ --platform=linux/amd64 --tags ${{ github.ref_name }} --base-import-paths
          ko build ./cmd/spire-identity-exchange-server/ --platform=linux/amd64 --tags ${{ github.ref_name }} --base-import-paths
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
